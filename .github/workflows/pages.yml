# Publishes the trigfacts/ folder to GitHub Pages on every push to main.
# Because the turksmathstuff.github.io site uses turksmathstuff.com, this repo's Pages site
# is served at turksmathstuff.com/trigfacts/.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Don't publish if the tests fail.
      - name: Run tests
        working-directory: trigfacts
        run: node --test _tests/*.test.js

      # Pages from Actions skips Jekyll, so leave the tests out by hand.
      - name: Copy the page without its tests
        run: rsync -a --exclude _tests trigfacts/ _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
